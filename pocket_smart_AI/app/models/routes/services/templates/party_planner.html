<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="PocketSmartAI Party Planner - Create an AI-powered party plan."
    >

    <title>Party Planner - PocketSmartAI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

<header class="navbar">
    <div class="nav-container">

        <a href="/dashboard" class="brand">
            PocketSmartAI
        </a>

        <nav class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/history">History</a>
            <a href="/login" onclick="logoutUser(event)">
                Logout
            </a>
        </nav>

    </div>
</header>

<main class="main-content">

    <section class="planner-page">

        <div class="planner-header">

            <h1>🎉 Party Planner</h1>

            <p>
                Create a personalized party plan based on
                your occasion, budget, guests, theme, and requirements.
            </p>

        </div>

        <div class="planner-card">

            <form id="partyPlannerForm">

                <div class="form-group">

                    <label for="partyTitle">
                        Plan Title
                    </label>

                    <input
                        type="text"
                        id="partyTitle"
                        name="title"
                        placeholder="Example: Birthday Party Plan"
                        maxlength="200"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="partyType">
                        Party Type
                    </label>

                    <select
                        id="partyType"
                        name="party_type"
                        required
                    >

                        <option value="">
                            Select party type
                        </option>

                        <option value="Birthday">
                            Birthday
                        </option>

                        <option value="Wedding">
                            Wedding
                        </option>

                        <option value="Engagement">
                            Engagement
                        </option>

                        <option value="Anniversary">
                            Anniversary
                        </option>

                        <option value="Baby Shower">
                            Baby Shower
                        </option>

                        <option value="Farewell">
                            Farewell
                        </option>

                        <option value="Family Gathering">
                            Family Gathering
                        </option>

                        <option value="Dinner Party">
                            Dinner Party
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="partyBudget">
                        Budget (₹)
                    </label>

                    <input
                        type="number"
                        id="partyBudget"
                        name="budget"
                        placeholder="Example: 25000"
                        min="0"
                        step="1"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="guestCount">
                        Number of Guests
                    </label>

                    <input
                        type="number"
                        id="guestCount"
                        name="guest_count"
                        placeholder="Example: 50"
                        min="1"
                        max="10000"
                        step="1"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="partyTheme">
                        Preferred Theme
                    </label>

                    <select
                        id="partyTheme"
                        name="theme"
                        required
                    >

                        <option value="">
                            Select a theme
                        </option>

                        <option value="Elegant">
                            Elegant
                        </option>

                        <option value="Traditional">
                            Traditional
                        </option>

                        <option value="Modern">
                            Modern
                        </option>

                        <option value="Minimalist">
                            Minimalist
                        </option>

                        <option value="Floral">
                            Floral
                        </option>

                        <option value="Colorful">
                            Colorful
                        </option>

                        <option value="Kids">
                            Kids
                        </option>

                        <option value="Custom">
                            Custom
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="partyVenue">
                        Venue
                    </label>

                    <input
                        type="text"
                        id="partyVenue"
                        name="venue"
                        placeholder="Example: Home, hotel, restaurant, outdoor hall"
                        maxlength="300"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="partyRequirements">
                        Additional Requirements
                    </label>

                    <textarea
                        id="partyRequirements"
                        name="requirements"
                        rows="6"
                        maxlength="2000"
                        placeholder="Describe food preferences, decorations, activities, music, invitations, return gifts, or any other requirements."
                        required
                    ></textarea>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="partyPlannerButton"
                >
                    Generate Party Plan
                </button>

            </form>

            <div
                id="partyPlannerMessage"
                class="planner-message"
                aria-live="polite"
            ></div>

            <div
                id="partyPlannerResult"
                class="planner-result"
                hidden
            >

                <h2>
                    ✨ Your AI Party Plan
                </h2>

                <div
                    id="partyPlannerResponse"
                    class="ai-response"
                ></div>

            </div>

        </div>

    </section>

</main>

<footer class="footer">

    <p>
        &copy; 2026 PocketSmartAI.
        Smart planning powered by AI.
    </p>

</footer>

<script src="{{ url_for('static', path='script.js') }}"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById(
        "partyPlannerForm"
    );

    const button = document.getElementById(
        "partyPlannerButton"
    );

    const message = document.getElementById(
        "partyPlannerMessage"
    );

    const result = document.getElementById(
        "partyPlannerResult"
    );

    const responseBox = document.getElementById(
        "partyPlannerResponse"
    );

    if (!form) {
        return;
    }

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const token = localStorage.getItem(
            "access_token"
        );

        if (!token) {

            message.textContent =
                "Please login before creating a party plan.";

            message.className =
                "planner-message error";

            window.location.href = "/login";

            return;
        }

        const title = document.getElementById(
            "partyTitle"
        ).value.trim();

        const partyType = document.getElementById(
            "partyType"
        ).value;

        const budget = document.getElementById(
            "partyBudget"
        ).value;

        const guestCount = document.getElementById(
            "guestCount"
        ).value;

        const theme = document.getElementById(
            "partyTheme"
        ).value;

        const venue = document.getElementById(
            "partyVenue"
        ).value.trim();

        const requirements = document.getElementById(
            "partyRequirements"
        ).value.trim();

        const inputData = [
            "Party Type: " + partyType,
            "Budget: ₹" + budget,
            "Number of Guests: " + guestCount,
            "Preferred Theme: " + theme,
            "Venue: " + venue,
            "Additional Requirements: " + requirements
        ].join("\n");

        button.disabled = true;
        button.textContent = "Generating...";

        message.textContent =
            "Creating your personalized party plan...";

        message.className =
            "planner-message";

        result.hidden = true;

        try {

            const response = await fetch(
                "/api/planners",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },

                    body: JSON.stringify({
                        planner_type: "party",
                        title: title,
                        input_data: inputData
                    })
                }
            );

            let data;

            try {
                data = await response.json();
            } catch {
                data = {};
            }

            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Unable to generate the party plan."
                );
            }

            responseBox.textContent =
                data.ai_response ||
                "No AI response was returned.";

            result.hidden = false;

            message.textContent =
                "Party plan created successfully.";

            message.className =
                "planner-message success";

        } catch (error) {

            console.error(
                "Party planner error:",
                error
            );

            message.textContent =
                error.message ||
                "Something went wrong. Please try again.";

            message.className =
                "planner-message error";

        } finally {

            button.disabled = false;
            button.textContent = "Generate Party Plan";
        }
    });
});
</script>

</body>
</html>
