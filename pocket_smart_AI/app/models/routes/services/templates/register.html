<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create a PocketSmartAI account."
    >

    <title>Register - PocketSmartAI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

<header class="navbar">
    <div class="nav-container">

        <a href="/" class="brand">
            PocketSmartAI
        </a>

        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/login">Login</a>
        </nav>

    </div>
</header>

<main class="main-content">

    <section class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    👤
                </div>

                <h1>
                    Create Account
                </h1>

                <p>
                    Join PocketSmartAI and start creating
                    personalized AI plans.
                </p>

            </div>

            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        minlength="2"
                        maxlength="100"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        maxlength="255"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        maxlength="100"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="6"
                        maxlength="100"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary auth-button"
                    id="registerButton"
                >
                    Create Account
                </button>

            </form>

            <div
                id="registerMessage"
                class="planner-message"
                aria-live="polite"
            ></div>

            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="/login">
                        Login here
                    </a>
                </p>

            </div>

        </div>

    </section>

</main>

<footer class="footer">

    <p>
        &copy; 2026 PocketSmartAI.
        Smart planning powered by AI.
    </p>

</footer>

<script src="{{ url_for('static', path='script.js') }}"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById(
        "registerForm"
    );

    const button = document.getElementById(
        "registerButton"
    );

    const message = document.getElementById(
        "registerMessage"
    );

    if (!form) {
        return;
    }

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const name = document.getElementById(
            "name"
        ).value.trim();

        const email = document.getElementById(
            "email"
        ).value.trim().toLowerCase();

        const password = document.getElementById(
            "password"
        ).value;

        const confirmPassword = document.getElementById(
            "confirmPassword"
        ).value;

        if (name.length < 2) {

            message.textContent =
                "Please enter your full name.";

            message.className =
                "planner-message error";

            return;
        }

        if (password.length < 6) {

            message.textContent =
                "Password must contain at least 6 characters.";

            message.className =
                "planner-message error";

            return;
        }

        if (password !== confirmPassword) {

            message.textContent =
                "Passwords do not match.";

            message.className =
                "planner-message error";

            return;
        }

        button.disabled = true;
        button.textContent = "Creating Account...";

        message.textContent =
            "Creating your account...";

        message.className =
            "planner-message";

        try {

            const response = await fetch(
                "/api/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                }
            );

            let data;

            try {
                data = await response.json();
            } catch {
                data = {};
            }

            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Unable to create your account."
                );
            }

            message.textContent =
                "Account created successfully. Redirecting to login...";

            message.className =
                "planner-message success";

            form.reset();

            window.setTimeout(
                function () {
                    window.location.href = "/login";
                },
                1000
            );

        } catch (error) {

            console.error(
                "Registration error:",
                error
            );

            message.textContent =
                error.message ||
                "Registration failed. Please try again.";

            message.className =
                "planner-message error";

            button.disabled = false;
            button.textContent = "Create Account";
        }
    });
});
</script>

</body>
</html>
