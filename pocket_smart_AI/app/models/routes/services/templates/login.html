<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Login to PocketSmartAI"
    >

    <title>Login - PocketSmartAI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

<header class="navbar">
    <div class="nav-container">

        <a href="/" class="brand">
            PocketSmartAI
        </a>

        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/register">Register</a>
        </nav>

    </div>
</header>

<main class="main-content">

    <section class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    🔐
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to your PocketSmartAI account.
                </p>

            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        maxlength="255"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        minlength="6"
                        maxlength="100"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary auth-button"
                    id="loginButton"
                >
                    Login
                </button>

            </form>

            <div
                id="loginMessage"
                class="planner-message"
                aria-live="polite"
            ></div>

            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="/register">
                        Create an account
                    </a>
                </p>

            </div>

        </div>

    </section>

</main>

<footer class="footer">

    <p>
        &copy; 2026 PocketSmartAI.
        Smart planning powered by AI.
    </p>

</footer>

<script src="{{ url_for('static', path='script.js') }}"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById(
        "loginForm"
    );

    const button = document.getElementById(
        "loginButton"
    );

    const message = document.getElementById(
        "loginMessage"
    );

    if (!form) {
        return;
    }

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const email = document.getElementById(
            "email"
        ).value.trim().toLowerCase();

        const password = document.getElementById(
            "password"
        ).value;

        if (!email || !password) {

            message.textContent =
                "Please enter your email and password.";

            message.className =
                "planner-message error";

            return;
        }

        button.disabled = true;
        button.textContent = "Logging in...";

        message.textContent = "Signing you in...";
        message.className = "planner-message";

        try {

            const response = await fetch(
                "/api/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            let data;

            try {
                data = await response.json();
            } catch {
                data = {};
            }

            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Invalid email or password."
                );
            }

            if (!data.access_token) {

                throw new Error(
                    "Login succeeded, but no access token was returned."
                );
            }

            localStorage.setItem(
                "access_token",
                data.access_token
            );

            message.textContent =
                "Login successful. Redirecting...";

            message.className =
                "planner-message success";

            window.setTimeout(
                function () {
                    window.location.href = "/dashboard";
                },
                500
            );

        } catch (error) {

            console.error(
                "Login error:",
                error
            );

            message.textContent =
                error.message ||
                "Unable to login. Please try again.";

            message.className =
                "planner-message error";

            button.disabled = false;
            button.textContent = "Login";
        }
    });
});
</script>

</body>
</html>
